name: Windows Viewer

on:
  push:
    branches: [v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release
      - name: Upload portable Viewer
        uses: actions/upload-artifact@v4
        with:
          name: RaceBox-Windows
          path: out/RaceBoxTelemetryViewer-*-win64.zip
          if-no-files-found: error
